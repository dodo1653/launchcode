<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LAUNCHCODE 3D film</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #050404; }
  canvas#gl { position: absolute; inset: 0; }
  .ov { position: absolute; pointer-events: none; }
  .line { left: 0; right: 0; display: flex; justify-content: center; gap: 20px; font: 600 70px Inter, sans-serif; letter-spacing: -0.025em; color: #fff; text-shadow: 0 2px 26px rgba(255, 60, 40, 0.22); }
  .line span { display: inline-block; }
  #end { inset: 0; }
  .wm { position: absolute; left: 0; right: 0; top: 700px; text-align: center; font: 900 150px/1 Archivo, sans-serif; font-stretch: 125%; letter-spacing: -0.01em; color: #fff; text-shadow: 0 6px 50px rgba(255, 50, 30, 0.35); }
  .sub { position: absolute; left: 0; right: 0; top: 880px; text-align: center; font: 600 40px Inter, sans-serif; letter-spacing: -0.01em; color: rgba(255,255,255,.82); }
  .tk { position: absolute; left: 0; right: 0; top: 950px; text-align: center; font: 700 26px 'JetBrains Mono', monospace; letter-spacing: .18em; color: #ff4a3d; }
  #grain { inset: 0; opacity: .06; mix-blend-mode: overlay; }
  #vig { inset: 0; background: radial-gradient(ellipse 80% 72% at 50% 50%, transparent 55%, rgba(0, 0, 0, .55)); }
  #black { inset: 0; background: #000; opacity: 0; }
</style>
<script>window.READY = false; window.DURATION = 10</script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }</script>
</head><body>
<canvas id="gl" width="1920" height="1080"></canvas>
<div class="ov line" id="l1" style="top:150px"><span>Every</span><span>narrative</span><span>gets</span><span>a</span><span>first</span><span>coin.</span></div>
<div class="ov line" id="l2" style="top:930px"><span>Arm</span><span>yours</span><span>before</span><span>it</span><span>breaks.</span></div>
<div class="ov line" id="l3" style="top:56px"><span>Pick</span><span>a</span><span>trigger.</span></div>
<div class="ov line" id="l4" style="top:56px"><span>It</span><span>fires</span><span>the</span><span>second</span><span>it</span><span>hits.</span></div>
<div class="ov" id="end"><div class="wm" id="wm">LAUNCHCODE</div><div class="sub" id="sub">Armed launches for pump.fun</div><div class="tk" id="tkr">$LAUNCHCODE</div></div>
<div class="ov" id="grain"></div><div class="ov" id="vig"></div><div class="ov" id="black"></div>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js'

const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)))
const lerp = (a, b, x) => a + (b - a) * x
const eOut = (x) => 1 - Math.pow(1 - x, 3), eIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2), eIO5 = (x) => (x < 0.5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2)
const eBack = (x) => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const V = (x, y, z) => new THREE.Vector3(x, y, z)
const vlerp = (a, b, x) => a.clone().lerp(b, x)

// ---------------- renderer, studio, post
const canvas = document.getElementById('gl')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true })
renderer.setSize(1920, 1080, false); renderer.setPixelRatio(1)
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap
const scene = new THREE.Scene(); scene.background = new THREE.Color('#050404'); scene.fog = new THREE.Fog('#050404', 14, 40)
const pmrem = new THREE.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
scene.environmentIntensity = 0.5
const camera = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.05, 200)
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshPhysicalMaterial({ color: '#0c0909', roughness: 0.32, metalness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.2 }))
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor)
const key = new THREE.SpotLight('#fff3ea', 110, 30, 0.45, 0.7, 1.4); key.position.set(-4, 7, 5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0005; scene.add(key, key.target)
const rim = new THREE.SpotLight('#ff3020', 160, 30, 0.6, 0.9, 1.5); rim.position.set(5, 3.5, -5); scene.add(rim, rim.target)
const fill = new THREE.DirectionalLight('#8aa6ff', 0.35); fill.position.set(-6, 2, -3); scene.add(fill)
const ledLight = new THREE.PointLight('#ff2a1a', 0, 3, 2); scene.add(ledLight)
const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
const bloom = new UnrealBloomPass(new THREE.Vector2(1920, 1080), 0.22, 0.4, 0.96); composer.addPass(bloom)
const bokeh = new BokehPass(scene, camera, { focus: 6, aperture: 0.0012, maxblur: 0.008 }); composer.addPass(bokeh)
composer.addPass(new OutputPass())

// ---------------- the switch (the Blender model)
const gltf = await new GLTFLoader().loadAsync('switch.glb')
const sw = gltf.scene; sw.scale.setScalar(1.6); scene.add(sw)
let hinge = null, ledMat = null, ledObj = null
sw.traverse((o) => {
  if (o.name === 'hinge') hinge = o
  if (o.isMesh) {
    o.castShadow = true; o.receiveShadow = true
    const m = o.material
    if (m.name === 'led') { ledMat = m; ledObj = o; m.emissive = new THREE.Color('#ff2010') }
    if (m.name === 'red') { o.material = new THREE.MeshPhysicalMaterial({ color: '#8f0c08', roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.06 }) }
    if (m.name === 'plate') { m.roughness = 0.34; m.metalness = 1; m.color = new THREE.Color('#141416') }
    if (m.name === 'chrome') { m.roughness = 0.16; m.metalness = 1; m.color = new THREE.Color('#bfc0c6') }
    if (m.name === 'paint') { m.color = new THREE.Color('#a8a29a'); m.roughness = 0.7; m.emissive = new THREE.Color('#000') }
  }
})
const box = new THREE.Box3().setFromObject(sw); sw.position.y -= box.min.y      // sit on the floor
const C = new THREE.Box3().setFromObject(sw).getCenter(new THREE.Vector3())
key.target.position.copy(C); rim.target.position.copy(C)
const ledPos = new THREE.Vector3(); if (ledObj) ledObj.getWorldPosition(ledPos)
ledLight.position.copy(ledPos).add(V(0, 0.25, 0))

// ---------------- the product: the real UI on a slab, trigger tiles that rise off it, the sealed card
const loadTex = (u) => new Promise((ok) => new THREE.TextureLoader().load(u, (t) => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; ok(t) }))
const uiTex = await loadTex('ui_arm.jpg')
const UI = new THREE.Group(); UI.position.set(30, 0, 0); scene.add(UI)
const SLW = 16, SLH = 10
const slab = new THREE.Mesh(new RoundedBoxGeometry(SLW, SLH, 0.18, 6, 0.18), [null, null, null, null, null, null].map(() => new THREE.MeshStandardMaterial({ color: '#0d0a0a', roughness: 0.5 })))
slab.material[4] = new THREE.MeshStandardMaterial({ map: uiTex, roughness: 0.55, emissive: '#ffffff', emissiveMap: uiTex, emissiveIntensity: 0.55 })
const slabG = new THREE.Group(); slabG.add(slab); UI.add(slabG)
slabG.rotation.set(-1.02, 0.1, 0.06); slabG.position.set(0, 2.2, 0)
const uiLight = new THREE.PointLight('#ffb070', 30, 30, 2); uiLight.position.set(30, 6, 4); scene.add(uiLight)
// a point on the slab in slab coordinates (x, y in the texture's 1600 x 1000 pixels, z above the surface)
const P = (px, py, z = 0) => slabG.localToWorld(V((px / 1600 - 0.5) * SLW, (0.5 - py / 1000) * SLH, 0.09 + z))
function iconTex(svg, label, color) {
  return new Promise((ok) => {
    const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d')
    const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#221818'); gr.addColorStop(1, '#0f0b0b'); g.fillStyle = gr; g.beginPath(); g.roundRect(0, 0, 256, 256, 60); g.fill()
    g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 4; g.beginPath(); g.roundRect(2, 2, 252, 252, 58); g.stroke()
    const im = new Image(); im.onload = () => { g.drawImage(im, 64, 64, 128, 128); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; ok(t) }
    im.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg.replace(/#ffb547/g, color))
  })
}
const S = (d) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ffb547" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`
const ICONS = [S('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h10M7 16h7"/>'), S('<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2M3 9h18"/>'), S('<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'), S('<path d="M12 3l3 6 6 .9-4.5 4.3 1 6.1L12 17.3 6.5 20.3l1-6.1L3 9.9 9 9z"/>'), S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')]
const tileTex = await Promise.all(ICONS.map((s) => iconTex(s, '', '#ffb547')))
const tileHot = await iconTex(ICONS[0], '', '#ffd27a')
const tiles = ICONS.map((_, i) => {
  const m = new THREE.Mesh(new RoundedBoxGeometry(0.78, 0.78, 0.2, 6, 0.16), [0, 1, 2, 3, 4, 5].map((k) => new THREE.MeshPhysicalMaterial(k === 4 ? { map: tileTex[i], roughness: 0.3, clearcoat: 1, emissive: '#ffffff', emissiveMap: tileTex[i], emissiveIntensity: 0.35 } : { color: '#151010', roughness: 0.35, clearcoat: 1 })))
  m.castShadow = true; slabG.add(m); return m
})
// the trigger row on the sheet sits around y 626 in the capture: the tiles lift off it in a row
const TILE_AT = [[1170, 626], [1248, 626], [1327, 626], [1432, 626], [1522, 626]]
function cardTex(live) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 400; const g = c.getContext('2d')
  g.fillStyle = '#120d0d'; g.beginPath(); g.roundRect(0, 0, 1024, 400, 44); g.fill()
  g.strokeStyle = live ? '#4ade80' : '#ff3b2f'; g.lineWidth = 8; g.beginPath(); g.roundRect(4, 4, 1016, 392, 42); g.stroke()
  g.fillStyle = live ? '#132a1c' : '#2a1210'; g.beginPath(); g.roundRect(48, 60, 160, 160, 30); g.fill()
  if (live) { g.strokeStyle = '#4ade80'; g.lineWidth = 16; g.lineCap = 'round'; g.beginPath(); g.moveTo(92, 142); g.lineTo(122, 172); g.lineTo(168, 108); g.stroke() }
  else { g.strokeStyle = '#ff3b2f'; g.lineWidth = 12; g.beginPath(); g.arc(128, 122, 26, Math.PI, 0); g.stroke(); g.fillStyle = '#ff3b2f'; g.beginPath(); g.roundRect(90, 122, 76, 62, 10); g.fill() }
  g.fillStyle = '#fff'; g.font = '900 66px Archivo'; g.fillText(live ? 'LIVE ON PUMP.FUN' : '$????', 240, 140)
  g.fillStyle = live ? '#4ade80' : '#9a908d'; g.font = '700 34px "JetBrains Mono"'; g.fillText(live ? 'fired the second it hit' : 'sealed until it fires', 244, 196)
  g.fillStyle = '#ffb547'; g.font = '700 32px "JetBrains Mono"'; g.fillText('trigger: a headline with your words', 48, 300)
  g.fillStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.roundRect(48, 330, 928, 16, 8); g.fill(); g.fillStyle = live ? '#4ade80' : '#ff3b2f'; g.beginPath(); g.roundRect(48, 330, live ? 928 : 300, 16, 8); g.fill()
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t
}
await document.fonts.load('900 78px Archivo'); await document.fonts.load('700 34px "JetBrains Mono"')
const cardSealed = cardTex(false), cardLive = cardTex(true)
const cardMats = [0, 1, 2, 3, 4, 5].map((k) => new THREE.MeshPhysicalMaterial({ color: '#120d0d', roughness: 0.3, clearcoat: 1 }))
cardMats[4] = new THREE.MeshPhysicalMaterial({ map: cardSealed, emissive: '#ffffff', emissiveMap: cardSealed, emissiveIntensity: 0.6, roughness: 0.3, clearcoat: 1 })
cardMats[5] = new THREE.MeshPhysicalMaterial({ map: cardLive, emissive: '#ffffff', emissiveMap: cardLive, emissiveIntensity: 0.7, roughness: 0.3, clearcoat: 1 })
const card = new THREE.Mesh(new RoundedBoxGeometry(4.1, 1.6, 0.14, 6, 0.12), cardMats); card.castShadow = true; slabG.add(card)

// ---------------- grain
const gc = document.createElement('canvas'); gc.width = gc.height = 256; const gg = gc.getContext('2d'), gd = gg.createImageData(256, 256)
for (let i = 0; i < gd.data.length; i += 4) { const v = Math.random() * 255; gd.data[i] = gd.data[i + 1] = gd.data[i + 2] = v; gd.data[i + 3] = 255 }
gg.putImageData(gd, 0, 0); document.getElementById('grain').style.background = `url(${gc.toDataURL()})`

// ---------------- text: word by word blur-in (the liked style)
function words(id, t0, t, out, gap = 0.18) {
  const el = document.getElementById(id), sp = [...el.children]
  const fo = seg(t, out, out + 0.3)
  el.style.opacity = t < t0 - 0.05 || t > out + 0.35 ? 0 : 1
  sp.forEach((s, i) => { const p = eOut(seg(t, t0 + i * gap, t0 + i * gap + 0.5)); s.style.opacity = p * (1 - fo); s.style.filter = `blur(${(1 - p) * 14 + fo * 10}px)`; s.style.transform = `translateY(${(1 - p) * 18}px) scale(${1 + fo * 0.15})` })
}

// ---------------- the shots
const look = (pos, at, focusDist) => { camera.position.copy(pos); camera.lookAt(at); bokeh.uniforms.focus.value = focusDist ?? pos.distanceTo(at) }
window.renderFrame = (t) => {
  // switch state: cover opens at 2.75, the LED comes on at 3.45
  const open = eBack(seg(t, 2.75, 3.35))
  if (hinge) hinge.rotation.x = -1.815 * open
  const led = t > 3.45 ? 1 : 0, flick = t > 3.45 && t < 3.6 ? (Math.sin(t * 200) > 0 ? 1 : 0.2) : 1
  if (ledMat) ledMat.emissiveIntensity = 0.1 + 9 * led * flick
  ledLight.intensity = 6 * led * flick
  rim.intensity = lerp(40, 160, seg(t, 0.2, 2.0))
  bloom.strength = t < 4.5 ? 0.2 + 0.25 * led : 0.25
  let black = 0
  if (t < 4.55) {
    // 1-2. the macro pass over the closed cover, then up and round as it opens
    const p1 = eIO(seg(t, 0, 2.6)), p2 = eIO5(seg(t, 2.4, 4.5))
    const a = vlerp(V(C.x + 1.9, C.y + 0.35, C.z + 2.1), V(C.x - 1.1, C.y + 0.55, C.z + 2.6), p1)
    const b = V(C.x + 0.4, C.y + 3.2, C.z + 6.2)
    const pos = vlerp(a, b, p2), at = vlerp(V(C.x, C.y + 0.45, C.z - 0.1), V(C.x, C.y + 0.2, C.z), p2)
    bokeh.uniforms.aperture.value = lerp(0.006, 0.0012, p2); look(pos, at)
    black = 1 - seg(t, 0, 0.45) + seg(t, 4.3, 4.55)
  } else if (t < 7.75) {
    // 3. the product: a low grazing dolly across the tilted UI, the tiles rise, the card seals then flips live
    const p = eIO(seg(t, 4.55, 7.75))
    const cardAt = P(1300, 640, 1.9), k = eIO(seg(t, 5.8, 6.6))
    const pos = vlerp(P(760, 1150, 2.2), P(980, 900, 4.2), p).lerp(P(1040, 1000, 5.2), k), at = vlerp(P(1250, 660, 0.3), P(1330, 600, 0.8), p).lerp(cardAt, k)
    bokeh.uniforms.aperture.value = 0.0018; look(pos, at)
    TILE_AT.forEach(([x, y], i) => {
      const r = eBack(seg(t, 4.85 + i * 0.1, 5.35 + i * 0.1)), w = P(x, y, 0.13 + 0.55 * r), m = tiles[i]
      m.position.copy(slabG.worldToLocal(w.clone())); m.scale.setScalar(Math.max(0.001, r)); m.rotation.set(0, 0, 0)
      if (i === 0) { const hot = seg(t, 5.6, 5.8); m.material[4].emissiveIntensity = 0.35 + 1.4 * hot; m.material[4].map = hot > 0.5 ? tileHot : tileTex[0]; m.material[4].emissiveMap = m.material[4].map }
      else m.material[4].emissiveIntensity = 0.35 * (1 - 0.6 * seg(t, 5.6, 5.8))
    })
    const cr = eBack(seg(t, 5.9, 6.4)), flip = eIO(seg(t, 6.75, 7.15))
    card.position.copy(slabG.worldToLocal(P(1300, 640, 0.25 + 1.65 * cr))); card.scale.setScalar(Math.max(0.001, cr)); card.rotation.set(1.02 * cr, Math.PI * flip, 0)   // stands up off the slab, then turns over
    uiLight.intensity = 30 + 60 * seg(t, 6.75, 7.0) * (1 - seg(t, 7.0, 7.6))
    uiLight.color.set(t > 6.85 ? '#7dffb0' : '#ffb070')
    black = 1 - seg(t, 4.55, 4.85) + seg(t, 7.5, 7.75)
  } else {
    // 4. the end: the armed switch, front three-quarter, a slow push in
    const p = eIO(seg(t, 7.75, 10))
    bokeh.uniforms.aperture.value = 0.0008; rim.intensity = 70
    look(vlerp(V(C.x + 1.2, C.y + 2.6, C.z + 10.5), V(C.x + 0.8, C.y + 2.3, C.z + 9.4), p), V(C.x, C.y + 0.5, C.z))
    camera.setViewOffset(1920, 1080, 0, 300, 1920, 1080)
    black = 1 - seg(t, 7.75, 8.05) + seg(t, 9.7, 10)
  }
  if (t < 7.75) camera.clearViewOffset()
  document.getElementById('black').style.opacity = Math.max(0, Math.min(1, black))
  words('l1', 0.45, t, 2.35); words('l2', 2.85, t, 4.25, 0.15)
  words('l3', 4.95, t, 6.05); words('l4', 6.3, t, 7.45, 0.12)
  const e = seg(t, 8.2, 8.7)
  document.getElementById('end').style.opacity = t > 8.0 ? 1 : 0
  ;[['wm', 8.15], ['sub', 8.55], ['tkr', 8.85]].forEach(([id, t0]) => { const x = eOut(seg(t, t0, t0 + 0.55)), el = document.getElementById(id); el.style.opacity = x; el.style.filter = `blur(${(1 - x) * 14}px)`; el.style.transform = `translateY(${(1 - x) * 20}px)` })
  composer.render()
}
window.renderFrame(0); window.READY = true
</script></body></html>
